name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sju
          POSTGRES_PASSWORD: sju
          POSTGRES_DB: sju_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
      continue-on-error: false
    
    - name: Setup environment files
      run: |
        # Create .env files if .env.example exists, otherwise create minimal ones
        if [ -f apps/api/.env.example ]; then
          cp apps/api/.env.example apps/api/.env
        else
          echo 'DATABASE_URL="postgresql://sju:sju@localhost:5432/sju_test"' > apps/api/.env
          echo 'PORT=4000' >> apps/api/.env
          echo 'AUTH_REQUIRED=false' >> apps/api/.env
        fi
        
        if [ -f apps/web/.env.example ]; then
          cp apps/web/.env.example apps/web/.env.local
        else
          echo 'VITE_API_URL=http://localhost:4000' > apps/web/.env.local
        fi
        
        # Ensure DATABASE_URL is set correctly for test database
        if grep -q "DATABASE_URL" apps/api/.env; then
          sed -i 's|DATABASE_URL=.*|DATABASE_URL="postgresql://sju:sju@localhost:5432/sju_test"|' apps/api/.env
        else
          echo 'DATABASE_URL="postgresql://sju:sju@localhost:5432/sju_test"' >> apps/api/.env
        fi
    
    - name: Wait for PostgreSQL
      run: |
        until pg_isready -h localhost -p 5432 -U sju; do
          echo "Waiting for PostgreSQL..."
          sleep 2
        done
        echo "PostgreSQL is ready!"
      continue-on-error: false
    
    - name: Generate Prisma Client
      run: npm --workspace apps/api run prisma:generate
      continue-on-error: false
    
    - name: Run database migrations
      run: npm --workspace apps/api run prisma:migrate
      continue-on-error: false
      env:
        DATABASE_URL: "postgresql://sju:sju@localhost:5432/sju_test"
    
    - name: Seed database
      run: npm --workspace apps/api run prisma:seed
      continue-on-error: false
      env:
        DATABASE_URL: "postgresql://sju:sju@localhost:5432/sju_test"
    
    - name: Run API tests
      run: npm --workspace apps/api run test
      continue-on-error: false
      env:
        DATABASE_URL: "postgresql://sju:sju@localhost:5432/sju_test"
        NODE_ENV: test
    
    - name: Lint API
      run: npm --workspace apps/api run lint
      continue-on-error: false
    
    - name: Lint Web
      run: npm --workspace apps/web run lint
      continue-on-error: false
    
    - name: Build API
      run: npm --workspace apps/api run build
      continue-on-error: false
    
    - name: Build Web
      run: npm --workspace apps/web run build
      continue-on-error: false
    
    - name: Run E2E tests
      run: npm --workspace apps/web run test:e2e
      continue-on-error: false
      env:
        CI: true
        DATABASE_URL: "postgresql://sju:sju@localhost:5432/sju_test"
        AUTH_REQUIRED: "true"

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
      continue-on-error: false
    
    - name: Run security audit
      run: npm audit --audit-level moderate || true
      continue-on-error: true
    
    - name: Verify audit-ci.json exists
      run: |
        if [ ! -f audit-ci.json ]; then
          echo "audit-ci.json not found, creating default"
          echo '{"moderate":true,"high":true,"critical":true,"allowlist":[],"report-type":"summary","skip-dev":false}' > audit-ci.json
        fi
      continue-on-error: false
    
    - name: Run dependency check with audit-ci
      run: npx audit-ci --config audit-ci.json || true
      continue-on-error: true
