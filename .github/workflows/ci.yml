name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sju
          POSTGRES_PASSWORD: sju
          POSTGRES_DB: sju_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Setup environment
      run: |
        cp apps/api/.env.example apps/api/.env
        cp apps/web/.env.example apps/web/.env.local
        sed -i 's|DATABASE_URL=.*|DATABASE_URL="postgresql://sju:sju@localhost:5432/sju_test"|' apps/api/.env
    
    - name: Generate Prisma Client
      run: npm --workspace apps/api run prisma:generate
    
    - name: Run database migrations
      run: npm --workspace apps/api run prisma:migrate
    
    - name: Seed database
      run: npm --workspace apps/api run prisma:seed
    
    - name: Run API tests
      run: npm --workspace apps/api run test
    
    - name: Build API
      run: npm --workspace apps/api run build
    
    - name: Build Web
      run: npm --workspace apps/web run build
    
    - name: Run E2E tests
      run: npm --workspace apps/web run test:e2e
      env:
        CI: true

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run security audit
      run: npm audit --audit-level moderate
    
    - name: Run dependency check
      run: npx audit-ci --config audit-ci.json