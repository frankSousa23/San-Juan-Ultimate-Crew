name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sju
          POSTGRES_PASSWORD: sju
          POSTGRES_DB: sju_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://sju:sju@localhost:5432/sju_dev?schema=public
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: Generate Prisma Client
        run: npm -w apps/api run prisma:generate
      - name: Migrate DB
        run: npm -w apps/api run prisma:migrate -- --name ci
      - name: Seed DB
        run: npm -w apps/api run prisma:seed
      - name: Build API
        run: npm -w apps/api run build
      - name: Build Web
        run: npm -w apps/web run build
      - name: Start API
        run: node apps/api/dist/index.js &
      - name: Wait for /health
        run: node apps/api/scripts/wait-health.cjs
      - name: Smoke E2E (CJS)
        run: node apps/api/scripts/smoke-e2e.cjs

  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sju
          POSTGRES_PASSWORD: sju
          POSTGRES_DB: sju_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://sju:sju@localhost:5432/sju_dev?schema=public
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: Generate Prisma Client
        run: npm -w apps/api run prisma:generate
      - name: Migrate DB
        run: npm -w apps/api run prisma:migrate -- --name ci
      - name: Seed DB
        run: npm -w apps/api run prisma:seed
      - name: Run API tests
        run: npm -w apps/api run test

  api-auth-guards:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sju
          POSTGRES_PASSWORD: sju
          POSTGRES_DB: sju_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://sju:sju@localhost:5432/sju_dev?schema=public
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173
      AUTH_REQUIRED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: Generate Prisma Client
        run: npm -w apps/api run prisma:generate
      - name: Migrate DB
        run: npm -w apps/api run prisma:migrate -- --name ci
      - name: Seed DB
        run: npm -w apps/api run prisma:seed
      - name: Run Auth Guard Test
        run: npm -w apps/api run test:auth
      - name: Run Players self-or-admin guard (AUTH on)
        run: npm -w apps/api run test -- -- src/players.selfOrAdmin.guard.test.ts
      - name: Run Role Requests workflow (AUTH on)
        run: npm -w apps/api run test -- -- src/roleRequests.test.ts
      - name: Run Role Requests denial (AUTH on)
        run: npm -w apps/api run test -- -- src/roleRequests.deny.test.ts
      - name: Run Role Requests approve+link (AUTH on)
        run: npm -w apps/api run test -- -- src/roleRequests.approve.link.test.ts
      - name: Run Role Requests conflict+filter (AUTH on)
        run: npm -w apps/api run test -- -- src/roleRequests.conflict.and.filter.test.ts
      - name: Run Role Requests update (AUTH on)
        run: npm -w apps/api run test -- -- src/roleRequests.update.test.ts
      - name: Run Users admin endpoints (AUTH on)
        run: npm -w apps/api run test -- -- src/users.admin.test.ts
      - name: Run Users roles validation (AUTH on)
        run: npm -w apps/api run test -- -- src/users.roles.validation.test.ts

  web-e2e-auth:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sju
          POSTGRES_PASSWORD: sju
          POSTGRES_DB: sju_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://sju:sju@localhost:5432/sju_dev?schema=public
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173
      AUTH_REQUIRED: 'true'
      VITE_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: Generate Prisma Client
        run: npm -w apps/api run prisma:generate
      - name: Migrate DB
        run: npm -w apps/api run prisma:migrate -- --name ci
      - name: Seed DB
        run: npm -w apps/api run prisma:seed
      - name: Install Playwright Browsers
        run: npx -w apps/web playwright install --with-deps
      - name: Run all Web E2E (AUTH on, dev servers via Playwright)
        env:
          BASE_URL: http://localhost:5173
        run: npm -w apps/web run test:e2e
      - name: Upload Playwright test-results (AUTH on)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-auth
          path: apps/web/test-results
          retention-days: 7
      - name: Upload Playwright report (AUTH on)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-auth
          path: apps/web/playwright-report
          retention-days: 7

  web-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sju
          POSTGRES_PASSWORD: sju
          POSTGRES_DB: sju_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://sju:sju@localhost:5432/sju_dev?schema=public
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173
      AUTH_REQUIRED: 'false'
      VITE_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: Generate Prisma Client
        run: npm -w apps/api run prisma:generate
      - name: Migrate DB
        run: npm -w apps/api run prisma:migrate -- --name ci
      - name: Seed DB
        run: npm -w apps/api run prisma:seed
      - name: Install Playwright Browsers
        run: npx -w apps/web playwright install --with-deps
      - name: Run all Web E2E (AUTH off, dev servers via Playwright)
        env:
          BASE_URL: http://localhost:5173
        run: npm -w apps/web run test:e2e
      - name: Upload Playwright test-results (AUTH off)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/web/test-results
          retention-days: 7
      - name: Upload Playwright report (AUTH off)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
